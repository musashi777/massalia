<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{metaTitle}}</title>
<meta name="description" content="{{metaDescription}}">
<link rel="canonical" href="{{canonicalUrl}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{metaTitle}}">
<meta property="og:description" content="{{metaDescription}}">
<meta property="og:url" content="{{canonicalUrl}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="{{twitterHandle}}">
<meta name="twitter:title" content="{{metaTitle}}">
<meta name="twitter:description" content="{{metaDescription}}">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/improvements.css">
<script type="application/ld+json">
{{schemaJson}}
</script>
</head>
<body>
<a class="skip-link" href="#main">Aller au contenu</a>

<header class="site-header" role="banner">
  <p class="site-title"><a href="/">MASSALIA</a></p>
  <span class="site-tagline">Archives Ouvertes</span>
</header>

<main id="main">
  <div class="article-header">
    <nav class="breadcrumb" aria-label="Fil d'Ariane">
      <a href="/">Massalia</a>
      <span class="breadcrumb-sep" aria-hidden="true">→</span>
      <span class="current">{{title}}</span>
    </nav>
    <h1 class="page-title">{{title}}</h1>
    <p class="page-lede">{{lede}}</p>
  </div>

  <figure class="hero-media">
    {{heroBlock}}
  </figure>

  <div class="article-wrap">
    <div class="article-body">{{contentHtml}}</div>

    <section class="couches-section" aria-label="Pages associées">
      <h2 class="siblings-heading">Explorer les périodes et thématiques</h2>
      <div class="couches">{{childrenCards}}</div>
    </section>

    <a class="back-link" href="/">← Retour à l'accueil</a>
  </div>
</main>

<footer class="site-footer" role="contentinfo">
  <div class="footer-inner">
    <div class="footer-bottom">
      <span class="footer-copy">© 2024 Massalia Archival Society</span>
      <a href="/" style="color:rgba(209,228,251,0.25);font-size:0.65rem;font-weight:700;letter-spacing:0.4em;text-transform:uppercase;font-family:var(--font-sans);">Accueil</a>
    </div>
  </div>
</footer>
<script src="/scripts/enhancements.js"></script>
</body>
</html>

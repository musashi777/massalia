<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{metaTitle}}</title>
<meta name="description" content="{{metaDescription}}">
<link rel="canonical" href="{{canonicalUrl}}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{metaTitle}}">
<meta property="og:description" content="{{metaDescription}}">
<meta property="og:url" content="{{canonicalUrl}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="{{twitterHandle}}">
<meta name="twitter:title" content="{{metaTitle}}">
<meta name="twitter:description" content="{{metaDescription}}">
<meta name="twitter:image" content="{{ogImage}}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">

<script type="application/ld+json">
{{schemaJson}}
</script>
</head>
<body>
<a class="skip-link" href="#main">Aller au contenu</a>

<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <span class="brand__badge">Dossier Référence</span>
      <p class="site-title"><a href="/">Massalia</a></p>
    </div>
    <p class="site-tagline">Histoire &amp; Patrimoine de Marseille</p>
  </div>
</header>

<main id="main">
  <section class="hero wrap">
    <div class="hero__content">
      <p class="hero__eyebrow">Dossier de référence</p>
      <h1>{{title}}</h1>
      <p class="hero__lede">{{lede}}</p>
    </div>
    {{heroBlock}}
  </section>

  <div class="wrap">
    <div class="article-body">
      {{contentHtml}}
    </div>

    <section class="couches-section">
      <h2 class="siblings-heading">Explorer les périodes et thématiques</h2>
      <div class="couches">
        {{childrenCards}}
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <p>Massalia — Dossier indépendant sur l'histoire et le patrimoine de Marseille.</p>
</footer>
</body>
</html>

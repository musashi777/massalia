name: Validate and deploy Massalia

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Build, validate and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression tests and validate semantic mesh
        run: npm test && node scripts/validate-mesh.js

      - name: Deploy to Vercel production
        if: github.event_name != 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          working-directory: ./

      - name: Verify production SEO headers and URLs
        if: github.event_name != 'pull_request'
        run: node scripts/verify-production-seo.js https://massalia-puce.vercel.app
